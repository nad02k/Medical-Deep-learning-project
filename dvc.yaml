  #     - src/alignment/
  #     - configs/params.yaml

  # ────────────────────────────────────────────────────────────────────────────
  # Stage 5: Multimodal fusion model training (Tâche suivante)
  # ────────────────────────────────────────────────────────────────────────────
  # train:
